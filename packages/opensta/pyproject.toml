[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tclint-plugins-opensta"
version = "0.1.0"
description = "OpenSTA Tcl/SDC command spec plugins for tclint, versioned by OpenSTA minor release"
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/gigeresk/tclint-plugins"

[project.optional-dependencies]
test = ["tclint>=0.9.0", "pytest", "pyyaml"]
dev = ["pyyaml"]

[project.entry-points."tclint.plugins"]
opensta = "tclint_plugins_opensta.versions.v3_1"
"opensta-3.1" = "tclint_plugins_opensta.versions.v3_1"
"opensta-3.0" = "tclint_plugins_opensta.versions.v3_0"
"opensta-2.7" = "tclint_plugins_opensta.versions.v2_7"

# Per-command usage docs, read by tclint-mcp (same names as the plugins above).
[project.entry-points."tclint_mcp.docs"]
"opensta-3.1" = "tclint_plugins_opensta.versions.v3_1"
"opensta-3.0" = "tclint_plugins_opensta.versions.v3_0"
"opensta-2.7" = "tclint_plugins_opensta.versions.v2_7"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tclint_plugins_opensta = ["data/*.json", "data/docs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
